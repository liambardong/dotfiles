# Nvim Dark tmux theme (based on default Neovim dark colorscheme)

set -g status-style "bg=#1c1c1c,fg=#a0a0a0"
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#5f87af"

set -g message-style "bg=#5f87af,fg=#1c1c1c"
set -g message-command-style "bg=#5f87af,fg=#1c1c1c"

set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "

set -g window-status-style "bg=#1c1c1c,fg=#606060"
set -g window-status-current-style "bg=#5f87af,fg=#1c1c1c,bold"
set -g window-status-activity-style "bg=#1c1c1c,fg=#d7875f"

set -g status-left-length 30
set -g status-left "#[bg=#5f87af,fg=#1c1c1c,bold] #S #[bg=#1c1c1c,fg=#a0a0a0] "
set -g status-right "#[fg=#606060]%Y-%m-%d #[fg=#a0a0a0,bold]%H:%M "
