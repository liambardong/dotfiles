# Terafox tmux theme (colors pulled from EdenEast/nightfox.nvim's terafox palette)

set -g status-style "bg=#0f1c1e,fg=#cbd9d8"
set -g pane-border-style "fg=#254147"
set -g pane-active-border-style "fg=#5a93aa"

set -g message-style "bg=#5a93aa,fg=#0f1c1e"
set -g message-command-style "bg=#5a93aa,fg=#0f1c1e"

set -g window-status-style "bg=#0f1c1e,fg=#587b7b"
set -g window-status-current-style "bg=#5a93aa,fg=#0f1c1e,bold"
set -g window-status-activity-style "bg=#0f1c1e,fg=#fda47f"

set -g status-left-length 30
set -g status-left "#[bg=#5a93aa,fg=#0f1c1e,bold] #S #[bg=#0f1c1e,fg=#5a93aa]"
set -g status-right "#[fg=#587b7b]%Y-%m-%d %H:%M "
