# Enable mouse
set -g mouse on

# Vim-style pane navigation (no prefix: Alt + h/j/k/l)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Easier resizing with Alt + arrows (no prefix)
bind -n M-Left resize-pane -L 3
bind -n M-Right resize-pane -R 3
bind -n M-Up resize-pane -U 3
bind -n M-Down resize-pane -D 3

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Ensure truecolor support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides "*:hyperlinks"

# Allow Kitty graphics protocol passthrough (required for image.nvim)
set -g allow-passthrough on
set -ga update-environment TERM_PROGRAM

# TPM plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
run '~/.tmux/plugins/tpm/tpm'

set -g @plugin 'erikw/tmux-dark-notify'
set -g @dark-notify-theme-path-light '$HOME/dotfiles/nvim-light.tmux.conf'
set -g @dark-notify-theme-path-dark '$HOME/dotfiles/nvim-dark.tmux.conf'

if-shell "test -e ~/.local/state/tmux/tmux-dark-notify-theme.conf" \
  "source-file ~/.local/state/tmux/tmux-dark-notify-theme.conf"

# Put the status bar (window tabs) at the top
set -g status-position top
