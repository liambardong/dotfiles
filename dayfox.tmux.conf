# Dayfox tmux theme (colors pulled from EdenEast/nightfox.nvim's dayfox palette)

set -g status-style "bg=#f2ede5,fg=#643f61"
set -g pane-border-style "fg=#d3c7bb"
set -g pane-active-border-style "fg=#2848a9"

set -g message-style "bg=#2848a9,fg=#f6f2ee"
set -g message-command-style "bg=#2848a9,fg=#f6f2ee"

# Give each tab a little breathing room: " <index> <name> "
set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "

set -g window-status-style "bg=#f2ede5,fg=#93857e"
set -g window-status-current-style "bg=#2848a9,fg=#f6f2ee,bold"
set -g window-status-activity-style "bg=#f2ede5,fg=#ac5402"

set -g status-left-length 30
set -g status-left "#[bg=#2848a9,fg=#f6f2ee,bold] #S #[bg=#f2ede5,fg=#643f61] "
set -g status-right "#[fg=#93857e]%Y-%m-%d #[fg=#643f61,bold]%H:%M "
