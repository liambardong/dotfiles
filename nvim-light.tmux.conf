# Nvim Light tmux theme (based on default Neovim light colorscheme)

set -g status-style "bg=#e4e4e4,fg=#4e4e4e"
set -g pane-border-style "fg=#c6c6c6"
set -g pane-active-border-style "fg=#005faf"

set -g message-style "bg=#005faf,fg=#ffffff"
set -g message-command-style "bg=#005faf,fg=#ffffff"

set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "

set -g window-status-style "bg=#e4e4e4,fg=#8a8a8a"
set -g window-status-current-style "bg=#005faf,fg=#ffffff,bold"
set -g window-status-activity-style "bg=#e4e4e4,fg=#af5f00"

set -g status-left-length 30
set -g status-left "#[bg=#005faf,fg=#ffffff,bold] #S #[bg=#e4e4e4,fg=#4e4e4e] "
set -g status-right "#[fg=#8a8a8a]%Y-%m-%d #[fg=#4e4e4e,bold]%H:%M "
